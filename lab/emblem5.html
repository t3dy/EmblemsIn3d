<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const IMG = '../images/cutouts/emblem-05/';
const PLATE = '../images/emblems/emblem-05-crop.png';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d0bb);
scene.fog = new THREE.Fog(0xd8d0bb, 34, 90);

const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 400);
camera.rotation.order = 'YXZ';
const START = { x:0, y:1.65, z:10.5, yaw:0, pitch:-0.03 };

scene.add(new THREE.HemisphereLight(0xfbf6e9, 0x8a836f, 1.02));
const key = new THREE.DirectionalLight(0xfff4e2, 1.1);
key.position.set(-7, 14, 12); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near = 1; key.shadow.camera.far = 90;
key.shadow.camera.left=-30; key.shadow.camera.right=30; key.shadow.camera.top=30; key.shadow.camera.bottom=-30;
key.shadow.bias = -0.0006; scene.add(key);
const fill = new THREE.DirectionalLight(0xeef0ff, 0.32); fill.position.set(9,6,-6); scene.add(fill);
const rake = new THREE.DirectionalLight(0xffffff, 0.0); rake.position.set(-16, 3, 8); scene.add(rake);

const floorMat = new THREE.MeshStandardMaterial({ color:0xcbc3ad, roughness:0.97 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200,200), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(200, 100, 0x9c957f, 0xbdb6a0);
grid.material.opacity = 0.18; grid.material.transparent = true; grid.position.y = 0.002; scene.add(grid);

// ---------- textures ----------
const TL = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function load(name, mip=true){
  return new Promise((res,rej)=> TL.load(name, t=>{
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
    if(mip){ t.minFilter = THREE.LinearMipmapLinearFilter; } else { t.minFilter = THREE.LinearFilter; t.generateMipmaps=false; }
    res(t);
  }, undefined, rej));
}
const FILES = {
  pair:'woman.png', house:'building_house.png', house2:'building_house_02.png',
  block:'castle.png', block2:'castle_02.png', temple:'castle_temple.png',
  tower:'tower.png', staffage:'staffage.png',
};
const T = {};
const jobs = Object.entries(FILES).map(([k,f]) => load(IMG+f).then(t=>T[k]=t));
jobs.push(load(PLATE, false).then(t=>T.plate=t));

// ---------- the adopted depth ladder (from EMBLEM5_SPATIAL_ANALYSIS.md §5) ----------
// x, z (− = deeper), h metres, t = texture key
const LAD = {
  pair:   { x:0.0,  z:0.0,   h:3.4, t:'pair'   },
  staff:  { x:-4.0, z:-7.0,  h:1.6, t:'staffage' },
  houseA: { x:7.5,  z:-4.0,  h:7.5, t:'house'  },
  houseB: { x:9.8,  z:-6.5,  h:8.6, t:'house2' },
  lowblk: { x:2.6,  z:-9.0,  h:4.6, t:'block2' },
  leftblk:{ x:-7.6, z:-8.5,  h:8.6, t:'block'  },
  cath:   { x:-5.0, z:-16.0, h:6.0, t:'temple' },
  tower:  { x:-1.5, z:-17.0, h:6.2, t:'tower'  },
};
const INK = 0x6f6a5c, STONE = 0xbfb7a2;
function aspect(tex){ const i = tex.image; return i ? i.width/i.height : 1; }

// ---------- primitive builders ----------
// flat printed standee; grounded => catches/casts light so it drops a shadow
function standee(tex, h, {x=0,y=null,z=0, toe=0, rake=0, grounded=false}={}){
  const w = h*aspect(tex);
  const mat = grounded
    ? new THREE.MeshStandardMaterial({ map:tex, transparent:true, alphaTest:0.35, side:THREE.DoubleSide, roughness:0.95 })
    : new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.35, side:THREE.DoubleSide });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.set(x, y==null ? h/2 : y, z);
  if (grounded) { m.castShadow = true; }
  m.rotation.y = toe; m.rotation.x = rake;
  m.renderOrder = Math.round(-z*10);
  return m;
}
// a dark near frame (the repoussoir pier), plain shadowed stone
function pier({x=-6.5,z=3.5,h=7,w=1.4}={}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,1.2),
    new THREE.MeshStandardMaterial({ color:0x4b463b, roughness:0.98 }));
  m.position.set(x, h/2, z); m.castShadow = m.receiveShadow = true;
  return m;
}
// extruded silhouette: N alpha-tested slices swept through depth → a solid engraved figure
function sliceStack(tex, h, {x=0,z=0,depth=0.4,slices=11}={}){
  const w = h*aspect(tex); const g = new THREE.Group();
  for (let i=0;i<slices;i++){
    const t = i/(slices-1);
    const edge = (i===0||i===slices-1);
    const mat = new THREE.MeshStandardMaterial({ map:tex, transparent:true, alphaTest:0.5, roughness:0.9,
      color: edge ? 0xffffff : 0xcac3b0 });
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
    pl.position.z = (t-0.5)*depth; pl.castShadow = true; g.add(pl);
  }
  g.position.set(x, h/2, z); return g;
}
// massed gabled house; optional engraving façade on the front
function house(tex, {x=0,z=0,w=5,h=6,d=4,roof=2.2, rot=0}={}){
  const g = new THREE.Group();
  const stone = new THREE.MeshStandardMaterial({ color:STONE, roughness:0.94 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), stone);
  body.position.y = h/2; body.castShadow = body.receiveShadow = true; g.add(body);
  const tri = new THREE.Shape();
  tri.moveTo(-w/2,0); tri.lineTo(w/2,0); tri.lineTo(0,roof); tri.closePath();
  const rgeo = new THREE.ExtrudeGeometry(tri, { depth:d, bevelEnabled:false }); rgeo.translate(0,0,-d/2);
  const roofM = new THREE.Mesh(rgeo, new THREE.MeshStandardMaterial({ color:0x6f6857, roughness:0.95 }));
  roofM.position.y = h; roofM.castShadow = roofM.receiveShadow = true; g.add(roofM);
  if (tex){
    const f = new THREE.Mesh(new THREE.PlaneGeometry(w*0.98, h*0.98),
      new THREE.MeshStandardMaterial({ map:tex, transparent:true, alphaTest:0.3, roughness:0.9 }));
    f.position.set(0, h/2, d/2+0.03); g.add(f);
  }
  g.position.set(x,0,z); g.rotation.y = rot; return g;
}
// a relief panel from an image (map + displacement)
function reliefPanel(tex, {w, h, z=0, y=null, scale=-0.95, bias=0.5, useAlpha=false, seg=380}={}){
  const geo = new THREE.PlaneGeometry(w, h, seg, Math.round(seg*h/w));
  const mat = new THREE.MeshStandardMaterial({ color:STONE, roughness:0.85,
    map:tex, displacementMap:tex, displacementScale:scale, displacementBias:bias });
  if (useAlpha){ mat.alphaMap = tex; mat.transparent = true; mat.alphaTest = 0.4; }
  const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true;
  m.position.set(0, y==null ? h/2 : y, z); return m;
}

// ---------- ladder placement ----------
function placeStandees(g, keys, {zmul=1, toeIn=0, rake=0, grounded=[]}={}){
  for (const k of keys){
    const L = LAD[k]; if(!L||!T[L.t]) continue;
    const z = L.z*zmul;
    const toe = toeIn ? -Math.sign(L.x)*Math.min(0.5, Math.abs(L.x)*0.03)*toeIn : 0;
    g.add(standee(T[L.t], L.h, { x:L.x, z, toe, rake, grounded:grounded.includes(k) }));
  }
}
const TOWN = ['cath','tower','leftblk','lowblk','houseA','houseB'];

// ---------- scenes ----------
function sceneShallow(){ const g=new THREE.Group(); placeStandees(g,[...TOWN,'pair'],{zmul:0.55}); return g; }
function sceneStage(){ const g=new THREE.Group(); placeStandees(g,[...TOWN,'pair'],{zmul:1}); return g; }
function sceneTrue(){ const g=new THREE.Group(); placeStandees(g,[...TOWN,'pair'],{zmul:2.2}); return g; }
function sceneRaked(){ const g=new THREE.Group(); placeStandees(g,[...TOWN,'pair'],{zmul:1.1, toeIn:1}); g.rotation.x=-0.05; return g; }
function sceneGrounded(){
  const g=new THREE.Group();
  placeStandees(g,[...TOWN],{zmul:1});
  placeStandees(g,['staff','pair'],{zmul:1, grounded:['staff','pair']});
  g.add(pier()); return g;
}

function sceneFacade(){
  const g=new THREE.Group();
  g.add(house(T.house,  {x:LAD.houseA.x, z:LAD.houseA.z, w:6,h:8,d:6, roof:3.0}));
  g.add(house(T.house2, {x:LAD.houseB.x, z:LAD.houseB.z, w:6,h:9,d:6, roof:3.2}));
  g.add(house(T.block,  {x:LAD.leftblk.x,z:LAD.leftblk.z,w:9,h:8,d:6, roof:2.6}));
  g.add(house(null,     {x:LAD.tower.x, z:LAD.tower.z, w:4,h:12,d:4, roof:3.6}));
  g.add(pier());
  g.add(sliceStack(T.pair, LAD.pair.h, {x:0,z:0,depth:0.34}));
  return g;
}
function sceneSlice(){
  const g=new THREE.Group();
  placeStandees(g,[...TOWN],{zmul:1});          // town stays as flats behind
  g.add(sliceStack(T.pair, LAD.pair.h, {x:0,z:0,depth:0.4,slices:13}));
  g.add(sliceStack(T.staffage, LAD.staff.h, {x:LAD.staff.x,z:LAD.staff.z,depth:0.18,slices:7}));
  g.add(pier()); return g;
}
function sceneBuiltTown(){
  const g=new THREE.Group();
  g.add(house(T.house,  {x:LAD.houseA.x, z:LAD.houseA.z, w:6,h:8, d:6, roof:3.0}));
  g.add(house(T.house2, {x:LAD.houseB.x, z:LAD.houseB.z, w:6,h:9, d:6, roof:3.2}));
  g.add(house(T.block,  {x:LAD.leftblk.x,z:LAD.leftblk.z,w:9,h:8, d:6, roof:2.6}));
  g.add(house(T.block2, {x:LAD.lowblk.x, z:LAD.lowblk.z, w:6,h:5, d:5, roof:2.0}));
  // far church: a towered mass
  g.add(house(null, {x:LAD.cath.x, z:LAD.cath.z, w:5,h:9,d:5, roof:2.6}));
  const spire = new THREE.Mesh(new THREE.ConeGeometry(1.6,6,4), new THREE.MeshStandardMaterial({color:0x8f8873,roughness:0.95}));
  spire.position.set(LAD.tower.x, 12, LAD.tower.z); spire.rotation.y=Math.PI/4; spire.castShadow=true; g.add(spire);
  const twr = new THREE.Mesh(new THREE.BoxGeometry(2.2,12,2.2), new THREE.MeshStandardMaterial({color:STONE,roughness:0.95}));
  twr.position.set(LAD.tower.x, 6, LAD.tower.z); twr.castShadow=true; g.add(twr);
  g.add(pier());
  g.add(sliceStack(T.pair, LAD.pair.h, {x:0,z:0,depth:0.42,slices:13}));
  g.add(sliceStack(T.staffage, LAD.staff.h, {x:LAD.staff.x,z:LAD.staff.z,depth:0.2,slices:7}));
  return g;
}

function sceneReliefPanel(){
  const g=new THREE.Group(); g.userData.rake=true;
  const ar = aspect(T.plate), H=6.6, W=H*ar;
  const panel = reliefPanel(T.plate,{w:W,h:H,z:-1.2, y:H/2+0.35, scale:-1.0, bias:0.55});
  const frameMat = new THREE.MeshStandardMaterial({ color:0x8f8873, roughness:0.9 });
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W+0.9,H+0.9,0.6), frameMat);
  frame.position.set(0,H/2+0.35,-1.75); frame.castShadow=frame.receiveShadow=true;
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(W+1.8,0.8,2.2), frameMat);
  plinth.position.set(0,0.4,-1.5); plinth.castShadow=plinth.receiveShadow=true;
  g.add(frame,panel,plinth); return g;
}
function sceneReliefLayer(){
  const g=new THREE.Group(); g.userData.rake=true;
  const ar = aspect(T.plate), H=6.6, W=H*ar;
  // town relief at the back
  const town = reliefPanel(T.plate,{w:W,h:H,z:-2.4, y:H/2+0.35, scale:-0.7, bias:0.4, seg:360});
  const frameMat = new THREE.MeshStandardMaterial({ color:0x8f8873, roughness:0.9 });
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W+0.9,H+0.9,0.6), frameMat);
  frame.position.set(0,H/2+0.35,-2.95); frame.castShadow=frame.receiveShadow=true;
  // the pair as a nearer relief cameo, cut to its silhouette by its own alpha
  const pah = aspect(T.pair), fh=3.6, fw=fh*pah;
  const fig = reliefPanel(T.pair,{w:fw,h:fh,z:0.4, y:fh/2, scale:-0.5, bias:0.28, useAlpha:true, seg:200});
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(W+1.8,0.8,3.2), frameMat);
  plinth.position.set(0,0.4,-1.6); plinth.castShadow=plinth.receiveShadow=true;
  g.add(frame,town,fig,plinth); return g;
}

// sculptural figures
function blockFigure(col,h){ const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:col,roughness:0.9});
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,h-0.7,5,10),m); body.position.y=h/2; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12),m); head.position.y=h+0.05; g.add(head);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}}); return g; }
function posedWoman(){ const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:0xcdc6b2,roughness:0.85});
  const skirt=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.62,1.15,24),m); skirt.position.y=0.575; g.add(skirt);
  const bod=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.2,0.55,18),m); bod.position.y=1.32; g.add(bod);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,20,16),m); head.position.y=1.78; g.add(head);
  const bun=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),m); bun.position.set(0,1.86,-0.12); g.add(bun);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.05,0.4,4,8),m); arm.position.set(0.16,1.42,0.18); arm.rotation.set(0.7,0,-0.5); g.add(arm);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}}); return g; }
function posedMan(){ const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:0xbcb49e,roughness:0.85});
  const legs=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.16,0.95,16),m); legs.position.y=0.48; g.add(legs);
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.24,0.7,16),m); torso.position.y=1.25; g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,16),m); head.position.y=1.72; g.add(head);
  const cloak=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.6,1.5,20,1,true,0.2,Math.PI*1.25),
    new THREE.MeshStandardMaterial({color:0xa89e86,roughness:0.9,side:THREE.DoubleSide})); cloak.position.set(0,1.05,-0.12); g.add(cloak);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.06,0.5,4,8),m); arm.position.set(-0.2,1.28,0.28); arm.rotation.set(0.9,0,0.6); g.add(arm);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}}); return g; }
function toad(){ const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:0x8f8a76,roughness:0.8});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,12),m); body.scale.set(1.3,0.8,1.1); g.add(body);
  for(const sx of[-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(0.03,0.1,3,6),m); leg.position.set(sx*0.12,-0.05,0.06); leg.rotation.z=sx*0.7; g.add(leg);}
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;}); return g; }
function townMasses(g){
  g.add(house(null,{x:LAD.houseA.x,z:LAD.houseA.z,w:6,h:8,d:6,roof:3.0}));
  g.add(house(null,{x:LAD.houseB.x,z:LAD.houseB.z,w:6,h:9,d:6,roof:3.2}));
  g.add(house(null,{x:LAD.leftblk.x,z:LAD.leftblk.z,w:8,h:7,d:6,roof:2.6}));
  const twr=new THREE.Mesh(new THREE.BoxGeometry(2.4,14,2.4),new THREE.MeshStandardMaterial({color:STONE,roughness:0.95}));
  twr.position.set(LAD.tower.x,7,LAD.tower.z-1); twr.castShadow=true; g.add(twr);
  const spire=new THREE.Mesh(new THREE.ConeGeometry(1.7,5,4),new THREE.MeshStandardMaterial({color:0x8f8873,roughness:0.95}));
  spire.position.set(LAD.tower.x,16.5,LAD.tower.z-1); spire.rotation.y=Math.PI/4; spire.castShadow=true; g.add(spire);
}
function sceneBlocky(){ const g=new THREE.Group(); townMasses(g);
  const w=blockFigure(0xcdc6b2,1.7); w.position.set(0.85,0,0); g.add(w);
  const man=blockFigure(0xbcb49e,1.75); man.position.set(-0.35,0,0.15); g.add(man);
  const t=toad(); t.position.set(0.5,1.2,0.2); g.add(t); return g; }
function scenePosed(){ const g=new THREE.Group(); townMasses(g);
  const w=posedWoman(); w.position.set(0.85,0,0); w.rotation.y=-0.5; g.add(w);
  const man=posedMan(); man.position.set(-0.35,0,0.15); man.rotation.y=0.5; g.add(man);
  const t=toad(); t.position.set(0.5,1.35,0.25); g.add(t); return g; }

// ---------- registry ----------
const SCENES = [
  { id:'t-shallow', label:'1a · Theatre — shadow-box (shallow Z)', build:sceneShallow,
    note:'Cut-out theatre with the depth-ladder compressed ×0.55 — a shallow peep-box. Strong parallax up close; the town crowds in.' },
  { id:'t-stage', label:'1b · Theatre — stage-depth (adopted)', build:sceneStage,
    note:'The adopted ladder (§5): occlusion order honoured, far distances stage-compressed for legibility. The default reading.' },
  { id:'t-true', label:'1c · Theatre — true-depth (realistic)', build:sceneTrue,
    note:'Ladder Z ×2.2 toward the measured scale ratios — the cathedral genuinely recedes. Realistic, but the far town becomes small.' },
  { id:'t-raked', label:'1d · Theatre — raked stage (toed-in flats)', build:sceneRaked,
    note:'Flats toed inward like stage wings and the whole set pitched — a theatrical diorama that hides the flatness from the seat.' },
  { id:'t-ground', label:'1e · Theatre — grounded + staffage + pier', build:sceneGrounded,
    note:'Figures drop real contact-shadows on the plaza; the two townsfolk + dog sit at mid-depth; the dark pier frames the left.' },
  { id:'k-facade', label:'2a · Thick — façade-on-mass', build:sceneFacade,
    note:'Buildings are solid masses wearing the engraving as a façade; the pair is a swept-slice slab. Walk between the blocks.' },
  { id:'k-slice', label:'2b · Thick — extruded silhouettes', build:sceneSlice,
    note:'The figures are true extruded silhouettes (a stack of alpha slices swept through depth) standing before flat town flats.' },
  { id:'k-town', label:'2c · Thick — deep built town + sliced figures', build:sceneBuiltTown,
    note:'A fully massed town (houses, church, tower) with the engraving façades, and the figures + staffage as extruded silhouettes.' },
  { id:'r-panel', label:'3a · Relief — single carved panel', build:sceneReliefPanel,
    note:'The whole plate as one bas-relief on a plinth, ink incised, a raking light across it. A monument you approach.' },
  { id:'r-layer', label:'3b · Relief — layered (figure cameo + town)', build:sceneReliefLayer,
    note:'Two rungs of the ladder restored: the pair as a nearer relief cameo standing proud of the town relief behind — relief + parallax.' },
  { id:'s-blocky', label:'4a · Sculptural — blocky massing (crude)', build:sceneBlocky,
    note:'The honest worst case: figures as capsules. Shown so the drift from the printed line is visible, not hidden.' },
  { id:'s-posed', label:'4b · Sculptural — posed & proportioned', build:scenePosed,
    note:'Modelled figures with skirt, cloak and toad, posed to the engraving. More considered — still no engraved line.' },
];

let groups = {}, active = null;
function show(id){
  active = id;
  for (const s of SCENES){
    if(!groups[s.id] && s.id===id){ groups[s.id] = s.build(); scene.add(groups[s.id]); }
    if(groups[s.id]) groups[s.id].visible = (s.id===id);
  }
  const g = groups[id];
  rake.intensity = g?.userData.rake ? 1.15 : 0.0;
  key.intensity  = g?.userData.rake ? 0.55 : 1.1;
  const s = SCENES.find(s=>s.id===id);
  document.getElementById('scene').value = id;
  document.getElementById('tag').textContent = s.label;
  document.getElementById('desc').innerHTML = `<b style="font-variant:small-caps">${s.label}</b> — ${s.note}`;
}

// build the menu
const sel = document.getElementById('scene');
SCENES.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.label; sel.appendChild(o); });
sel.addEventListener('change', ()=> show(sel.value));
function step(d){ const i=SCENES.findIndex(s=>s.id===active); show(SCENES[(i+d+SCENES.length)%SCENES.length].id); }
document.getElementById('prev').addEventListener('click', ()=>step(-1));
document.getElementById('next').addEventListener('click', ()=>step(1));

Promise.all(jobs).then(()=>{
  show(SCENES[0].id);
  document.getElementById('load').style.display = 'none';
}).catch(err=>{ document.getElementById('load').textContent = 'load failed: '+err.message; console.error(err); });

// ---------- first-person controls ----------
const stt = { yaw:START.yaw, pitch:START.pitch, keys:new Set(), locked:false, dragging:false, px:0, py:0 };
function reset(){ camera.position.set(START.x,START.y,START.z); stt.yaw=START.yaw; stt.pitch=START.pitch; }
reset();
const SENS = 0.0022;
canvas.addEventListener('click', ()=>{ if(!stt.locked) canvas.requestPointerLock?.(); });
document.addEventListener('pointerlockchange', ()=> stt.locked = document.pointerLockElement===canvas);
document.addEventListener('mousemove', e=>{
  if(stt.locked){ stt.yaw -= e.movementX*SENS; stt.pitch -= e.movementY*SENS; }
  else if(stt.dragging){ stt.yaw -= (e.clientX-stt.px)*SENS*1.4; stt.pitch -= (e.clientY-stt.py)*SENS*1.4; stt.px=e.clientX; stt.py=e.clientY; }
  stt.pitch = Math.max(-1.2, Math.min(1.2, stt.pitch));
});
canvas.addEventListener('mousedown', e=>{ if(!stt.locked){ stt.dragging=true; stt.px=e.clientX; stt.py=e.clientY; }});
window.addEventListener('mouseup', ()=> stt.dragging=false);
canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; stt.px=t.clientX; stt.py=t.clientY; }, {passive:true});
canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; stt.yaw-=(t.clientX-stt.px)*SENS*1.6; stt.pitch-=(t.clientY-stt.py)*SENS*1.6; stt.pitch=Math.max(-1.2,Math.min(1.2,stt.pitch)); stt.px=t.clientX; stt.py=t.clientY; }, {passive:true});
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='9'){ const idx=+k-1; if(SCENES[idx]) show(SCENES[idx].id); return; }
  if(k==='['){ step(-1); return; } if(k===']'){ step(1); return; }
  if(k==='r'){ reset(); return; }
  if(k===' '){ e.preventDefault(); }
  stt.keys.add(k);
});
window.addEventListener('keyup', e=> stt.keys.delete(e.key.toLowerCase()));

const clock = new THREE.Clock();
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function tick(){
  const dt = Math.min(0.05, clock.getDelta());
  camera.rotation.set(stt.pitch, stt.yaw, 0);
  const speed = (stt.keys.has('shift')?11:5.5)*dt;
  const fwd=new THREE.Vector3(-Math.sin(stt.yaw),0,-Math.cos(stt.yaw));
  const rgt=new THREE.Vector3(Math.cos(stt.yaw),0,-Math.sin(stt.yaw));
  const mv=new THREE.Vector3();
  if(stt.keys.has('w')||stt.keys.has('arrowup')) mv.add(fwd);
  if(stt.keys.has('s')||stt.keys.has('arrowdown')) mv.sub(fwd);
  if(stt.keys.has('d')||stt.keys.has('arrowright')) mv.add(rgt);
  if(stt.keys.has('a')||stt.keys.has('arrowleft')) mv.sub(rgt);
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(speed); camera.position.add(mv); }
  camera.position.x=Math.max(-55,Math.min(55,camera.position.x));
  camera.position.z=Math.max(-40,Math.min(55,camera.position.z));
  camera.position.y=START.y;
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
window.__scene=scene; window.__camera=camera; window.__show=show; window.__scenes=SCENES.map(s=>s.id);
</script>
